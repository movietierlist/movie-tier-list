<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Club</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎬 Movie Club</h1>
        <p>Your movie ranking list</p>
    </header>

    <main>

        <button id="addMovie">
            + Add Movie
        </button>

        <div class="tiers">

            <section class="tier">
                <h2>S ⭐</h2>
                <div class="movies" data-tier="S"></div>
            </section>

            <section class="tier">
                <h2>A</h2>
                <div class="movies" data-tier="A"></div>
            </section>

            <section class="tier">
                <h2>B</h2>
                <div class="movies" data-tier="B"></div>
            </section>

            <section class="tier">
                <h2>C</h2>
                <div class="movies" data-tier="C"></div>
            </section>

            <section class="tier">
                <h2>D</h2>
                <div class="movies" data-tier="D"></div>
            </section>

            <section class="tier">
                <h2>F</h2>
                <div class="movies" data-tier="F"></div>
            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
