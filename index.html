<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tier List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1 id="appTitle">🎬 Movie Tier List</h1>
</header>
<!-- HOME VIEW: pick or create a tier list -->
<div id="homeView" class="home-view hidden">
    <div class="top-buttons">
        <button id="newListButton">
            + New Tier List
        </button>
    </div>
    <div id="listGrid" class="list-grid"></div>
</div>
<!-- APP VIEW: the tier list editor -->
<main id="appView">
    <!-- TOP CONTROLS -->
    <div class="top-buttons">
        <button id="homeButton">
            🏠 Home
        </button>
        <button id="addMovie">
            + Add
        </button>
        <button id="addTextPosterMovie">
            + Add Movie (Text Poster)
        </button>
        <button id="addMultipleMovies">
            + Bulk Import
        </button>
        <button id="addTier">
            + Add Tier
        </button>
        <button id="deleteMovies">
            🗑 Delete Movies
        </button>
        <button id="settingsButton">
            ⚙ Settings
        </button>
        <button id="aboutButton">
            ℹ About
        </button>
    </div>
    <!-- SETTINGS PANEL -->
    <div 
        id="settingsPanel"
        class="settings-panel hidden">
        <h3>
            Card Layout
        </h3>
        <label>
            <input
                type="radio"
                name="cardStyle"
                value="title"
                checked>
            Poster + Title
        </label>
        <br>
        <label>
            <input
                type="radio"
                name="cardStyle"
                value="poster">
            Poster Only
        </label>
    </div>
    <!-- ABOUT PANEL -->
    <div
        id="aboutPanel"
        class="settings-panel hidden">
        <h3>
            About
        </h3>
        <img
            src="assets/tmdb-logo.svg"
            alt="The Movie Database logo"
            class="tmdb-logo">
        <p class="about-text">
            Movie Tier List — a TierMaker-style app for ranking movies.
            <br><br>
            This product uses the TMDB API but is not endorsed or certified by TMDB.
        </p>
    </div>
    <!-- TIERS -->
    <div id="tierContainer"></div>
    <!-- MOVIE BANK -->
    <section class="movie-bank">
        <h2>
            Unranked
        </h2>
        <div 
            id="movieBank"
            class="movies">
        </div>
    </section>
</main>
<!-- MODAL -->
<div 
    id="modalOverlay"
    class="modal-overlay hidden">
    <div class="modal">
        <h2 id="modalTitle"></h2>
        <div id="modalContent"></div>
        <div class="modal-buttons">
            <button id="modalCancel">
                Cancel
            </button>
            <button id="modalConfirm">
                Save
            </button>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
